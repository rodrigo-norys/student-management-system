name: backend

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: testes + gates estáticos
    runs-on: ubuntu-latest

    # A suíte roda contra MariaDB real, na mesma versão do local e da VPS. O
    # healthcheck segura os steps até o banco aceitar conexão.
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_pw
          # O default da 10.11 é utf8mb4/utf8mb4_general_ci, o mesmo charset do
          # bootstrap local.
          MARIADB_DATABASE: school_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # O .env é gitignored e não existe no runner. Só o mínimo da suíte: conexão e
    # o secret com que o helper forja os cookies.
    env:
      DATABASE: school_test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ci_root_pw
      ACCESS_TOKEN_SECRET: ci-secret-descartavel-nao-e-segredo-real
      ACCESS_TOKEN_EXPIRATION: 604800

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: instala dependências
        run: npm ci

      - name: lint
        run: npm run lint

      - name: formatação
        run: npm run format:check

      - name: typecheck (arquivos // @ts-check)
        run: npx tsc -p jsconfig.json

      # Os níveis 1-8 são o único seed necessário: o nível demo e os usuários de
      # teste nascem no setupTestData(). db:seed:all traria o students-addition e
      # o demo-seed, que depende de env vars.
      - name: bootstrap do school_test
        run: |
          npx sequelize-cli db:migrate
          npx sequelize-cli db:seed --seed 20260515170427-default-access-levels.js

      - name: testes
        run: npm test
