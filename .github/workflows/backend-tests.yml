name: backend

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: testes + gates estáticos
    runs-on: ubuntu-latest

    # A suíte roda contra MariaDB REAL (nunca SQLite) — mesma versão do local e da
    # VPS. O GitHub sobe este container ao lado do runner e só libera os steps
    # depois que o healthcheck passa, então não há corrida com o banco subindo.
    services:
      db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_pw
          # Cria o school_test já em utf8mb4/utf8mb4_general_ci — o default da
          # 10.11 é exatamente o charset do bootstrap local, então não precisa de
          # CREATE DATABASE manual.
          MARIADB_DATABASE: school_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # O .env é gitignored e NÃO existe aqui: o dotenv não acha nada e são estas
    # vars que valem (ele usa override:false, então nem competiria). Só o mínimo
    # da suíte: a conexão + o secret que o helper de teste usa para forjar os
    # cookies. CORS_ORIGINS não entra — supertest não manda header Origin e o app
    # libera quando não há origin. DEMO_USER_* também não: os testes forjam o
    # cookie do nível demo, não passam pelo endpoint de login.
    env:
      DATABASE: school_test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ci_root_pw
      ACCESS_TOKEN_SECRET: ci-secret-descartavel-nao-e-segredo-real
      ACCESS_TOKEN_EXPIRATION: 604800

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: instala dependências
        run: npm ci

      - name: lint
        run: npm run lint

      - name: formatação
        run: npm run format:check

      - name: typecheck (arquivos // @ts-check)
        run: npx tsc -p jsconfig.json

      # Espelha o bootstrap documentado do school_test local. db:seed:all NÃO:
      # traria o students-addition (27 alunos que a suíte não usa) e o demo-seed
      # (que depende de env vars). Os níveis 1-8 são o único seed necessário — o
      # nível 99 e os usuários de teste nascem no setupTestData() do helper.
      - name: bootstrap do school_test
        run: |
          npx sequelize-cli db:migrate
          npx sequelize-cli db:seed --seed 20260515170427-default-access-levels.js

      - name: testes
        run: npm test
